##############################################################################
# 🔧 Professional TMux Configuration
# Modern terminal multiplexer setup with sensible defaults
##############################################################################

# ============================================================================
# General Settings
# ============================================================================

# Use 256 color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:RGB"

# Enable mouse support
set -g mouse on

# History limit
set -g history-limit 50000

# Reduce command delay
set -s escape-time 0

# ============================================================================
# Key Bindings
# ============================================================================

# Set prefix to Ctrl+a (easier than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Split windows
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Navigate panes with arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Create new window with current directory
bind c new-window -c "#{pane_current_path}"

# Kill pane/window
bind x kill-pane
bind X kill-window

# ============================================================================
# Status Bar
# ============================================================================

# Position
set -g status-position bottom
set -g status-justify left

# Colors (Dracula theme)
set -g status-bg "#282a36"
set -g status-fg "#f8f8f2"

# Left status
set -g status-left "#[bg=#50fa7b,fg=#282a36]  #{session_name} #[bg=#282a36,fg=#f8f8f2]"

# Right status
set -g status-right "%H:%M · %d %b"

# Window list
setw -g window-status-format "#[fg=#6272a4]#I:#{window_name}"
setw -g window-status-current-format "#[bg=#bd93f9,fg=#282a36]#I:#{window_name}#[bg=#282a36,fg=#f8f8f2]"

# ============================================================================
# Pane Borders
# ============================================================================

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"

# ============================================================================
# Window Settings
# ============================================================================

# Auto-rename windows based on command
set -g automatic-rename on
set -g allow-rename on

# Start numbering from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is deleted
set -g renumber-windows on

# ============================================================================
# Copy Mode (Vi key bindings)
# ============================================================================

setw -g mode-keys vi

# Copy to macOS clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# ============================================================================
# Plugins (Optional - requires tpm)
# ============================================================================

# Install tpm (tmux plugin manager):
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

